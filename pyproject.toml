[project]
name = "entirius-django-faq"
version = "2.0.0"
description = "FAQ module for Volkanos — structured Q&A with soft entity references"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "factory-boy"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-faq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_faq"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1
"src/django_faq/api/admin/views/group_views.py" = ["B904"]
"src/django_faq/api/admin/views/item_views.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_faq"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# django_pim / django_contentdb: optional integrations (try/except ImportError fallbacks)
DEP001 = ["django_pim", "django_contentdb"]
# Pillow: required by models.ImageField at runtime (no direct import)
DEP002 = ["Pillow"]
